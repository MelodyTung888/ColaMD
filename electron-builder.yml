appId: com.melody.colamd
productName: ColaMD Melody
copyright: Copyright © 2024-2026 marswave.ai and ColaMD Melody contributors
artifactName: ColaMD-Melody-${version}-mac-${arch}.${ext}

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*

extraResources:
  - from: resources/templates
    to: templates
  - from: resources/demo
    to: demo

npmArgs:
  - "--loglevel=error"

afterPack: ./scripts/afterPack.js

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: txt
    name: Text Document
    role: Editor
    mimeType: text/plain

mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

publish:
  provider: github
  owner: MelodyTung888
  repo: ColaMD
